[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-backend"
version = "0.1.0"
description = "FinSight modular-monolith API foundation"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "feedparser>=6.0,<7",
    "yfinance>=0.2.50,<1",
    "huggingface-hub>=0.26,<1",
    "lxml>=5.3,<7",
    "pandas>=2.2,<3",
    "apscheduler>=3.10,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "torch>=2.6,<2.7",
    "transformers>=4.45,<5",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
reranking = [
    "cohere>=5,<6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
